<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commission Calculator v1.3</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="app-layout"><aside class="sidebar"><button class="btn copy" onclick="copyResults()">📋 Copy</button><button class="btn reset" onclick="resetCalc()">🔄 Reset</button><button class="btn dark" onclick="toggleDark()">🌙 Dark</button></aside><main class="calculator"><div class="hero"><div class="commission-card"><div>Total Commission</div><div id="heroTotal" class="hero-total">$0.00</div></div><div id="tierBadge" class="badge">No Sales</div></div><h1>Retail Commission Calculator</h1><input id="associate" placeholder="Associate Name (Optional)"><input id="revenue" type="number" placeholder="Total Revenue ($)"><input id="units" type="number" placeholder="Total Units Sold"><input id="revGoal" type="number" value="15000"><input id="unitGoal" type="number" value="10"><div class="card"><h3>Commission Breakdown</h3><div id="breakdown"></div></div><div class="card"><h3>Next Tier Progress</h3><div id="nextTier"></div><div class="progress-container"><div id="tierProgress" class="progress-bar success"></div></div></div><div class="card"><h3>Goal Progress</h3><div class="progress-container"><div id="revProgress" class="progress-bar"></div></div><div id="revText"></div><div class="progress-container"><div id="unitProgress" class="progress-bar"></div></div><div id="unitText"></div></div></main></div><script src="js/app.js"></script></body></html>
